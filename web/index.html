<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crunchyroller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=2.9">
</head>
<body>

  <header>
    <div class="brand">
      <img src="/logo.svg" alt="logo" class="brand-icon">
      <span class="brand-title">crunchy<b>roller</b></span>
    </div>
    <div class="header-right">
      <a href="https://github.com/Vure-sh/crunchyroller" target="_blank" rel="noopener noreferrer" class="btn-github-star" title="Star crunchyroller on GitHub">
        <svg height="14" viewBox="0 0 16 16" width="14" fill="currentColor">
          <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"></path>
        </svg>
        <span>Star</span>
      </a>
      <div class="badge" id="badge">
        <div class="dot"></div>
        <span id="badge-txt">offline</span>
      </div>
    </div>
  </header>

  <main>

    <div class="shell">

      <div id="star-banner" class="star-banner" style="display:none;">
        <div class="star-banner-left">
          <span class="star-banner-icon">⭐</span>
          <div class="star-banner-text">
            <span class="star-banner-title">Enjoying crunchyroller?</span>
            <span class="star-banner-desc">Please consider leaving a star on GitHub to support development!</span>
          </div>
        </div>
        <div class="star-banner-actions">
          <a href="https://github.com/Vure-sh/crunchyroller" target="_blank" rel="noopener noreferrer" class="btn-star-cta" onclick="dismissStarBanner(true)">
            ★ Star on GitHub
          </a>
          <button class="btn-star-dismiss" onclick="dismissStarBanner(false)" title="Dismiss">✕</button>
        </div>
      </div>

      <div class="card">
        <div class="card-label">session</div>
        <div class="field">
          <label>session token</label>
          <div class="row">
            <input type="password" id="tok" placeholder="etp_rt cookie value">
            <button class="btn-s" onclick="saveToken()">save</button>
          </div>
        </div>
        <div style="margin-top:12px">
          <button id="toggle-android-login-btn" onclick="toggleAndroidLoginForm()" style="width:100%">login (email / password)</button>
        </div>

        <div id="android-login-panel" style="display:none;">
          <div class="field">
            <label>email</label>
            <div class="row">
              <input type="email" id="login-email" placeholder="crunchyroll email">
            </div>
          </div>
          <div class="field" style="margin-top:4px;">
            <label>password</label>
            <div class="row">
              <input type="password" id="login-pass" placeholder="crunchyroll password">
              <button class="btn-s" id="btn-login-cred" onclick="loginCredentials()">sign in</button>
            </div>
          </div>
        </div>

        <p class="hint">
          paste your etp_rt cookie, or sign in directly with email & password.
        </p>
      </div>

      <div class="card">
        <div class="card-label">quality</div>
        <div class="grid2">
          <div class="field">
            <label>video</label>
            <div id="dd-video" class="select-dropdown"></div>
            <input type="hidden" id="vq" value="1080p">
          </div>
          <div class="field">
            <label>audio</label>
            <div id="dd-audio-qual" class="select-dropdown"></div>
            <input type="hidden" id="aq" value="192k">
          </div>
          <div class="field">
            <label>audio language</label>
            <div id="dd-audio" class="select-dropdown"></div>
            <input type="hidden" id="al" value="ja-JP">
          </div>
          <div class="field">
            <label>subtitles</label>
            <div id="dd-subs" class="select-dropdown"></div>
            <input type="hidden" id="sl" value="en-US">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">download</div>
        <div class="row">
          <input type="text" id="url" placeholder="paste a crunchyroll url">
          <button id="fetch-btn" onclick="fetchUrl()">fetch</button>
        </div>

        <label class="check-row" for="force-download">
          <input type="checkbox" id="force-download" onchange="saveCfg()">
          <span>force redownload and replace existing files</span>
        </label>

        <div id="tree">
          <hr class="div">
          <div class="ser-title-row">
            <div class="ser-title" id="ser-title"></div>
            <div class="tree-header-actions">
              <button class="btn-s" id="toggle-seasons-btn" onclick="toggleAllSeasons()">expand all</button>
              <button class="btn-s" onclick="pickAll(true)">all</button>
              <button class="btn-s" onclick="pickAll(false)">none</button>
              <button class="btn-s btn-dl-top" onclick="startDl()">download</button>
              <div class="tree-badge" id="tree-selected-count">0 selected</div>
            </div>
          </div>
          <div id="sn-list"></div>
          <hr class="div">
          <div class="row" style="justify-content:flex-end">
            <button class="btn-s" onclick="pickAll(true)">all</button>
            <button class="btn-s" onclick="pickAll(false)">none</button>
            <button id="dl-btn" onclick="startDl()">download</button>
          </div>
        </div>
      </div>

      <div class="card" id="dl-panel">
        <div class="card-label">progress</div>
        <div class="dl-status-row">
          <span id="pill" class="pill pill-run"><span class="spin"></span>downloading</span>
          <span id="dl-ep-counter" class="dl-counter">0 / 0</span>
          <span id="dl-speed" class="dl-speed"></span>
        </div>
        <div id="cur-ep" class="dl-ep-name"></div>
        <div class="dl-bar-label">
          <span class="dl-bar-title">overall</span>
          <span id="ppct-overall" class="dl-bar-pct">0.0%</span>
        </div>
        <div class="prog-bar-wrap">
          <div class="prog-bar" id="pbar-overall"></div>
        </div>
        <div class="dl-bar-label">
          <span class="dl-bar-title">track</span>
          <span id="dl-segs" class="dl-bar-pct"></span>
        </div>
        <div class="prog-bar-wrap prog-bar-wrap-sm">
          <div class="prog-bar prog-bar-dim" id="pbar-track"></div>
        </div>
        <div id="log"></div>
      </div>

    </div>

  </main>

  <div id="toast"></div>
  <script src="/js/particles.js?v=2.9"></script>
  <script src="/js/app.js?v=2.9"></script>
</body>
</html>
